name: Publish video_transcoder release

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-video-transcoder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin catalog
        uses: actions/checkout@v4
        with:
          ref: repo
          fetch-depth: 0

      - name: Download rpd6 release and metadata
        run: |
          set -euo pipefail
          mkdir -p video_transcoder
          curl -fL --retry 3 \
            https://github.com/rpd-odr/plugin.video_transcoder/releases/download/0.1.20-rpd6/video_transcoder-0.1.20-rpd6.zip \
            -o video_transcoder/video_transcoder-0.1.20-rpd6.zip
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/rpd-odr/plugin.video_transcoder/master/info.json \
            -o video_transcoder/info.json
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/rpd-odr/plugin.video_transcoder/master/changelog.md \
            -o video_transcoder/changelog.md

      - name: Update catalog index and checksum
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          index_path = Path("repo.json")
          index = json.loads(index_path.read_text())
          plugin = json.loads(Path("video_transcoder/info.json").read_text())
          for i, item in enumerate(index["plugins"]):
              if item.get("id") == "video_transcoder":
                  index["plugins"][i] = plugin
                  break
          else:
              index["plugins"].insert(0, plugin)
          index_path.write_text(json.dumps(index, indent=4, ensure_ascii=False) + "\n")
          PY
          md5sum repo.json | awk '{print $1}' > repo.json.md5

      - name: Commit catalog update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_transcoder/info.json video_transcoder/changelog.md \
            video_transcoder/video_transcoder-0.1.20-rpd6.zip repo.json repo.json.md5
          git commit -m "Publish video_transcoder 0.1.20-rpd6"
          git push origin repo
